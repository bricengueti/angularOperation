<div class="h-screen max-w-[270px] bg-[#F2EAE1] flex flex-col shadow-lg border-r border-gray-200">
  <!-- Header avec titre -->
  <div class="p-6">
    <div class="flex items-center mb-8">
      <div class="w-1 h-8 bg-[#FEAF00] mr-3 rounded-full"></div>
      <div class="text-xl font-bold text-[#111827] tracking-wide">CRUD OPERATIONS</div>
    </div>

    <!-- Profil utilisateur -->
    <div class="text-center flex flex-col gap-4">
      <div class="w-40 h-40 mx-auto mb-4 rounded-full overflow-hidden bg-gray-300 ring-4 ring-[#FEAF00] ring-opacity-20">
        <img
          src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop&crop=face&auto=format"
          alt="Karthi Madesh Profile"
          class="w-full h-full object-cover"
        >
      </div>
      <h6 class="font-semibold text-[#111827] text-xs mb-1">Karthi Madesh</h6>
      <p class="text-[#FEAF00] text-sm font-medium  bg-opacity-10 px-3 py-1 rounded-full inline-block">Admin</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6 justify-center items-center">
    <ul class="flex flex-col  gap-4">
      <li>
        <a
          href="#"
          class="flex items-center justify-center gap-4 px-4 py-3 rounded-xl transition-all duration-200 group"
          [class]="activeRoute === 'home' ? 'bg-[#FEAF00] text-white ' : 'text-[#6B7280] hover:bg-[#FEAF00] hover:bg-opacity-10 hover:text-[#FEAF00]'"
          (click)="setActiveRoute('home')"
        >
          <svg class="w-5 h-5 mr-3 transition-transform duration-200 group-hover:scale-110" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
          </svg>
          <span class="font-medium">Home</span>
        </a>
      </li>

      <li>
        <a
          href="#"
          class="flex items-center  justify-center gap-4 px-4 py-3 rounded-xl transition-all duration-200 group"
          [class]="activeRoute === 'course' ? 'bg-[#FEAF00] text-white shadow-lg shadow-[#FEAF00]/25' : 'text-[#6B7280] hover:bg-[#FEAF00] hover:bg-opacity-10 hover:text-[#FEAF00]'"
          (click)="setActiveRoute('course')"
        >
          <svg class="w-5 h-5 mr-3 transition-transform duration-200 group-hover:scale-110" fill="currentColor" viewBox="0 0 20 20">
            <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"></path>
          </svg>
          <span class="font-medium">Course</span>
        </a>
      </li>

      <li>
        <a
          href="#"
          class="flex items-center  justify-center gap-4 px-4 py-3 rounded-xl transition-all duration-200 group"
          [class]="activeRoute === 'students' ? 'bg-[#FEAF00] text-white shadow-lg shadow-[#FEAF00]/25' : 'text-[#6B7280] hover:bg-[#FEAF00] hover:bg-opacity-10 hover:text-[#FEAF00]'"
          (click)="setActiveRoute('students')"
        >
          <svg class="w-5 h-5 mr-3 transition-transform duration-200 group-hover:scale-110" fill="currentColor" viewBox="0 0 20 20">
            <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3z"></path>
          </svg>
          <span class="font-medium">Students</span>
        </a>
      </li>

      <li>
        <a
          href="#"
          class="flex items-center  justify-center gap-4 px-4 py-3 rounded-xl transition-all duration-200 group"
          [class]="activeRoute === 'payment' ? 'bg-[#FEAF00] text-white shadow-lg shadow-[#FEAF00]/25' : 'text-[#6B7280] hover:bg-[#FEAF00] hover:bg-opacity-10 hover:text-[#FEAF00]'"
          (click)="setActiveRoute('payment')"
        >
          <svg class="w-5 h-5 mr-3 transition-transform duration-200 group-hover:scale-110" fill="currentColor" viewBox="0 0 20 20">
            <path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4zM18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z"></path>
          </svg>
          <span class="font-medium">Payment</span>
        </a>
      </li>

      <li>
        <a
          href="#"
          class="flex items-center  justify-center gap-4 px-4 py-3 rounded-xl transition-all duration-200 group"
          [class]="activeRoute === 'report' ? 'bg-[#FEAF00] text-white shadow-lg shadow-[#FEAF00]/25' : 'text-[#6B7280] hover:bg-[#FEAF00] hover:bg-opacity-10 hover:text-[#FEAF00]'"
          (click)="setActiveRoute('report')"
        >
          <svg class="w-5 h-5 mr-3 transition-transform duration-200 group-hover:scale-110" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
            <path fill-rule="evenodd" d="M4 5a2 2 0 012-2v1a2 2 0 002 2h6a2 2 0 002-2V3a2 2 0 012 2v6a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path>
          </svg>
          <span class="font-medium">Report</span>
        </a>
      </li>

      <li>
        <a
          href="#"
          class="flex items-center  justify-center gap-4 px-4 py-3 rounded-xl transition-all duration-200 group"
          [class]="activeRoute === 'settings' ? 'bg-[#FEAF00] text-white shadow-lg shadow-[#FEAF00]/25' : 'text-[#6B7280] hover:bg-[#FEAF00] hover:bg-opacity-10 hover:text-[#FEAF00]'"
          (click)="setActiveRoute('settings')"
        >
          <svg class="w-5 h-5 mr-3 transition-transform duration-200 group-hover:scale-110" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path>
          </svg>
          <span class="font-medium">Settings</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Logout -->
  <div class="p-4">
    <button
      class="flex items-center justify-between px-4 py-3 text-[#6B7280] hover:bg-red-50 hover:text-red-600 rounded-xl transition-all duration-200 w-full group"
      (click)="logout()"
    >
      <div class="flex items-center">
        <svg class="w-5 h-5 mr-3 transition-transform duration-200 group-hover:scale-110" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"></path>
        </svg>
        <span class="font-medium">Logout</span>
      </div>
      <svg class="w-4 h-4 transition-transform duration-200 group-hover:translate-x-1" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"></path>
      </svg>
    </button>
  </div>
</div>
