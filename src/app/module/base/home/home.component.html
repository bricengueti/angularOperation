<div class="flex h-screen bg-gray-50">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Contenu principal -->
  <div class="flex-1 flex flex-col">
    <!-- Header -->
    <app-header></app-header>

    <!-- Contenu du dashboard -->
    <main class="flex-1 p-8">
      <div class="max-w-7xl mx-auto">
        <!-- Cartes de statistiques -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
          <!-- Students Card -->
          <div class="bg-blue-50 rounded-lg p-6 border border-blue-100">
            <div class="flex items-center justify-between mb-4">
              <div class="p-3 bg-blue-100 rounded-lg">
                <svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0zM6 18a1 1 0 001-1v-2.065a8.935 8.935 0 00-2-.712V17a1 1 0 001 1z"></path>
                </svg>
              </div>
            </div>
            <div>
              <p class="text-blue-600 text-sm font-medium mb-1">Students</p>
              <p class="text-3xl font-bold text-gray-900">{{ stats.students }}</p>
            </div>
          </div>

          <!-- Course Card -->
          <div class="bg-pink-50 rounded-lg p-6 border border-pink-100">
            <div class="flex items-center justify-between mb-4">
              <div class="p-3 bg-pink-100 rounded-lg">
                <svg class="w-6 h-6 text-pink-600" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"></path>
                </svg>
              </div>
            </div>
            <div>
              <p class="text-pink-600 text-sm font-medium mb-1">Course</p>
              <p class="text-3xl font-bold text-gray-900">{{ stats.courses }}</p>
            </div>
          </div>

          <!-- Payments Card -->
          <div class="bg-yellow-50 rounded-lg p-6 border border-yellow-100">
            <div class="flex items-center justify-between mb-4">
              <div class="p-3 bg-yellow-100 rounded-lg">
                <svg class="w-6 h-6 text-yellow-600" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M8.433 7.418c.155-.103.346-.196.567-.267v1.698a2.305 2.305 0 01-.567-.267C8.07 8.34 8 8.114 8 8c0-.114.07-.34.433-.582zM11 12.849v-1.698c.22.071.412.164.567.267.364.243.433.468.433.582 0 .114-.07.34-.433.582a2.305 2.305 0 01-.567.267z"></path>
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.076 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.511-1.31c-.563-.649-1.413-1.076-2.354-1.253V5z" clip-rule="evenodd"></path>
                </svg>
              </div>
            </div>
            <div>
              <p class="text-yellow-600 text-sm font-medium mb-1">Payments</p>
              <p class="text-3xl font-bold text-gray-900">INR {{ stats.payments | number }}</p>
            </div>
          </div>

          <!-- Users Card -->
          <div class="bg-primary rounded-lg p-6 text-white">
            <div class="flex items-center justify-between mb-4">
              <div class="p-3 bg-white bg-opacity-20 rounded-lg">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3z"></path>
                </svg>
              </div>
            </div>
            <div>
              <p class="text-white text-opacity-90 text-sm font-medium mb-1">Users</p>
              <p class="text-3xl font-bold text-white">{{ stats.users }}</p>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>
