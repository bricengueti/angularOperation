<div class="container mx-auto p-6">
  <!-- En-tête simplifié comme dans la capture d'écran -->
  <div class="bg-gray-50 px-6 py-4 mb-6 rounded-lg">
    <div class="flex items-center justify-between">
      <h6 class="text-xs font-bold text-[#2D1810]">Products Inventory</h6>

      <button
        class="bg-[#FEAF00] hover:bg-[#e59d00] text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200 text-sm"
        (click)="addNewProduct()"
      >
        ADD NEW PRODUCT
      </button>
    </div>
  </div>



  <!-- Table HTML sémantique -->
  <div class="bg-white border-t border-gray-300  overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <!-- En-tête du tableau -->
      <thead class="bg-gray-50">
        <tr>
          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
            (click)="sortBy('name')"
          >
            <div class="flex items-center">
              Product
              <span class="ml-1">
                <svg *ngIf="getSortIcon('name') === 'sort'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                </svg>
                <svg *ngIf="getSortIcon('name') === 'sort-up'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                </svg>
                <svg *ngIf="getSortIcon('name') === 'sort-down'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </span>
            </div>
          </th>

          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
            (click)="sortBy('category')"
          >
            <div class="flex items-center">
              Category
              <span class="ml-1">
                <svg *ngIf="getSortIcon('category') === 'sort'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                </svg>
                <svg *ngIf="getSortIcon('category') === 'sort-up'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                </svg>
                <svg *ngIf="getSortIcon('category') === 'sort-down'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </span>
            </div>
          </th>

          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
            (click)="sortBy('price')"
          >
            <div class="flex items-center">
              Price
              <span class="ml-1">
                <svg *ngIf="getSortIcon('price') === 'sort'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                </svg>
                <svg *ngIf="getSortIcon('price') === 'sort-up'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                </svg>
                <svg *ngIf="getSortIcon('price') === 'sort-down'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </span>
            </div>
          </th>

          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
            (click)="sortBy('stock')"
          >
            <div class="flex items-center">
              Stock
              <span class="ml-1">
                <svg *ngIf="getSortIcon('stock') === 'sort'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                </svg>
                <svg *ngIf="getSortIcon('stock') === 'sort-up'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                </svg>
                <svg *ngIf="getSortIcon('stock') === 'sort-down'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </span>
            </div>
          </th>

          <th
            scope="col"
            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
            (click)="sortBy('lastUpdated')"
          >
            <div class="flex items-center">
              Last Updated
              <span class="ml-1">
                <svg *ngIf="getSortIcon('lastUpdated') === 'sort'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path>
                </svg>
                <svg *ngIf="getSortIcon('lastUpdated') === 'sort-up'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                </svg>
                <svg *ngIf="getSortIcon('lastUpdated') === 'sort-down'" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </span>
            </div>
          </th>

          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Status
          </th>

          <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
            Actions
          </th>
        </tr>
      </thead>

      <!-- Corps du tableau -->
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let product of filteredProducts" class="hover:bg-gray-50 transition-colors duration-150">
          <!-- Nom avec image -->
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center">
              <div class="flex-shrink-0 h-10 w-10 mr-4">
                <img class="h-10 w-10 rounded object-cover" [src]="product.imageUrl" [alt]="product.name">
              </div>
              <div class="font-medium text-gray-900">{{ product.name }}</div>
            </div>
          </td>

          <!-- Catégorie -->
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 py-1 text-xs font-medium rounded-full bg-gray-100 text-gray-800">
              {{ product.category }}
            </span>
          </td>

          <!-- Prix -->
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
            {{ formatPrice(product.price) }}
          </td>

          <!-- Stock -->
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            {{ product.stock }} units
          </td>

          <!-- Date de mise à jour -->
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            {{ product.lastUpdated }}
          </td>

          <!-- Statut -->
          <td class="px-6 py-4 whitespace-nowrap">
            <span
              class="px-2 py-1 text-xs font-medium rounded-full"
              [ngClass]="getStockStatusClass(product.stock)"
            >
              {{ product.stock > 30 ? 'In Stock' : (product.stock > 10 ? 'Low Stock' : 'Critical Stock') }}
            </span>
          </td>

          <!-- Actions -->
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <div class="flex items-center justify-end space-x-3">
              <button
                class="text-[#FEAF00] hover:text-[#e59d00] transition-colors duration-200"
                (click)="editProduct(product.id)"
                [attr.aria-label]="'Edit ' + product.name"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
              </button>
              <button
                class="text-red-500 hover:text-red-700 transition-colors duration-200"
                (click)="deleteProduct(product.id)"
                [attr.aria-label]="'Delete ' + product.name"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </div>
          </td>
        </tr>


      </tbody>
    </table>
  </div>

</div>
